name: Deploy zu netcup

on:
  push:
    branches: [main]
  # Manueller Start über den "Actions"-Tab in GitHub
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Produktions-Build erzeugen
        run: npm run build

      # lftp statt FTP-Deploy-Action: der netcup/Plesk-FTP-Server verlangt
      # TLS Session Reuse auf der Datenverbindung, was nur lftp sauber beherrscht.
      - name: Per FTPS zu netcup hochladen
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          # Zielordner im Webspace: Domain-Ordner + httpdocs
          # (Struktur laut Plesk File Manager: Basisverzeichnis > drakzittau.de > httpdocs)
          # verify-certificate off: das Plesk-FTP-Zertifikat von netcup ist nicht
          # auf den Hosting-Hostnamen ausgestellt; die Verbindung bleibt TLS-verschlüsselt.
          cat > /tmp/deploy.lftp <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          mirror -R --delete --exclude angebote.json --parallel=4 --verbose dist/ drakzittau.de/httpdocs/
          EOF
          lftp -f /tmp/deploy.lftp
